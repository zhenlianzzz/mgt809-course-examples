name: Publish course examples
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify and unpack approved website assets
        run: |
          base64 --decode website-assets.zip.b64 > website-assets.zip
          echo 'cde41e52fe1b4f6b62b8e2d29a1faefc8d85ff8239668fa7d87f0291be2a59d3  website-assets.zip' | sha256sum --check
          python3 -m zipfile -e website-assets.zip source
          cp -R overrides/. source/docs/
          test -f source/docs/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: source/docs
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
